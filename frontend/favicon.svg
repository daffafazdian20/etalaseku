<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Midnight Tech with Warm Indigo Hue -->
    <linearGradient id="nsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    
    <!-- Primary Hot Glow Gradient (Radical Pink to Sunset Gold) -->
    <linearGradient id="nsNexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="48%" stop-color="#FF2E63"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Metallic Gleam Highlight -->
    <linearGradient id="nsGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Starburst Gold Gradient -->
    <linearGradient id="nsSparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9A6"/>
      <stop offset="45%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF2E63"/>
    </linearGradient>

    <!-- Outer Soft Neon Glow -->
    <filter id="nsNeonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF2E63" flood-opacity="0.45"/>
    </filter>

    <filter id="nsSparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Radiant Cyber Rim -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#nsBgGrad)" stroke="rgba(255, 46, 99, 0.45)" stroke-width="2.5"/>
  
  <!-- Ambient Soft Light Flares -->
  <circle cx="96" cy="30" r="36" fill="#FF2E63" opacity="0.22" filter="blur(16px)"/>
  <circle cx="30" cy="96" r="32" fill="#F59E0B" opacity="0.18" filter="blur(16px)"/>

  <!-- Futuristic Monogram "N" (NexStore) with Dynamic Angled Bevel -->
  <g filter="url(#nsNeonFilter)">
    <!-- Left Vertical Stem -->
    <rect x="32" y="30" width="14" height="68" rx="7" fill="url(#nsNexGlow)"/>
    
    <!-- Right Vertical Stem -->
    <rect x="82" y="30" width="14" height="68" rx="7" fill="url(#nsNexGlow)"/>

    <!-- Dynamic Diagonal Slash with Sleek Tech Bridge -->
    <path d="M42 32L86 96C87.2 97.8 89.5 98.4 91.5 97.4C93.5 96.4 94.5 94.1 93.8 92L52 30C50.8 28.2 48.5 27.6 46.5 28.6C44.5 29.6 43.5 31.9 44.2 34L42 32Z" fill="url(#nsNexGlow)"/>
    
    <!-- Metallic Bevel Reflex Line -->
    <path d="M45 35L87 95" stroke="url(#nsGleam)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Digital Spark / Starburst (✦) at Top-Right of "N" -->
  <g transform="translate(96, 26)" filter="url(#nsSparkGlow)">
    <path d="M0 -12C1 -4.5 4.5 -1 12 0C4.5 1 1 4.5 0 12C-1 4.5 -4.5 1 -12 0C-4.5 -1 -1 -4.5 0 -12Z" fill="url(#nsSparkGold)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>
</svg>